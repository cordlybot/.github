name: Reusable documentation CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing mkdocs.yml
        required: false
        default: .
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.13"
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements-docs.txt
      - run: python tools/validate_docs.py
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - run: mkdocs build --strict
