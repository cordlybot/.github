name: Reusable documentation CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing mkdocs.yml
        required: false
        default: .
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.13"
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements-docs.txt
      - run: python tools/validate_docs.py
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - run: mkdocs build --strict
