name: Reusable Rust CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing Cargo.toml
        required: false
        default: .
        type: string
      toolchain:
        description: Rust toolchain channel or pinned version
        required: false
        default: stable
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust toolchain
        env:
          CORDLY_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        run: rustup toolchain install "$CORDLY_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        env:
          CORDLY_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        run: rustup override set "$CORDLY_RUST_TOOLCHAIN"
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
