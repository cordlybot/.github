name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository-relative working directory
        required: false
        default: .
        type: string
      project:
        description: Solution or project to restore, build, and test
        required: true
        type: string
      dotnet-version:
        description: .NET SDK version
        required: false
        default: 10.0.x
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet restore "${{ inputs.project }}"
      - run: dotnet format "${{ inputs.project }}" --no-restore --verify-no-changes
      - run: dotnet build "${{ inputs.project }}" --no-restore --configuration Release --warnaserror
      - run: dotnet test "${{ inputs.project }}" --no-build --configuration Release --logger "console;verbosity=normal"
